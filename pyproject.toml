[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exon-research"
version = "0.1.0"
description = "Quantitative crypto trading research platform inspired by Renaissance Technologies"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "requests>=2.31",
    "websocket-client>=1.6",
    "pyyaml>=6.0",
    "click>=8.1",
    "tabulate>=0.9",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.7", "seaborn>=0.12"]
ml = ["xgboost>=2.0", "lightgbm>=4.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1"]

[project.scripts]
exon = "exon.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["exon*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
